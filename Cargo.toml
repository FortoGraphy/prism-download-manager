[workspace]
resolver = "3"
members = [
  "crates/prism-engine",
  "crates/prism-core",
  "crates/prism-native-host",
  "crates/prism-testserver",
  "crates/prism-video",
  "crates/prism-torrent",
  "app/src-tauri",
]

[workspace.package]
version = "1.0.9"
edition = "2024"
license = "MIT"
authors = ["Prism contributors"]
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks", "http2", "charset", "system-proxy"] }
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
mime_guess = "2"
tempfile = "3"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
prism-engine = { path = "crates/prism-engine" }
prism-core = { path = "crates/prism-core" }
prism-video = { path = "crates/prism-video" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
