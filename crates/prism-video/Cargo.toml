[package]
name = "prism-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Prism video backend: managed yt-dlp / ffmpeg / deno, probing, quality choices, download planning and ffmpeg post-processing."

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
# SAPISIDHASH authorization for the native YouTube resolver (also used by prism-engine).
sha1 = { workspace = true }
# Archive handling for managed tool installs (pure Rust, no C toolchain needed).
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "optimization"] }
# The temporary cookies.txt for yt-dlp: created new, owner-only (0600), under a random name.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Encoder only for building test archives.
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
