<!doctype html>
<html lang="en" data-theme="dark" data-accent="prism" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism</title>
    <style>
      /* Critical first paint: independent of JS, bootstrap IPC and web fonts. */
      .startup-frame {
        position: fixed; inset: 0; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; border-radius: 12px;
        border: 1px solid #343640; background: #181920; color: #eeeef3;
        font: 14px system-ui, sans-serif;
      }
      .startup-frame strong { font-size: 20px; }
      .startup-frame span { color: #b7b8c3; }
    </style>
  </head>
  <body>
    <div id="root"><div class="startup-frame" role="status" data-tauri-drag-region><strong>Prism</strong><span>Loading…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
