name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-14            # cross-compiles x86_64 on Apple Silicon (Intel runners are being retired)
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No cache in a release build: a cache written by an earlier run would feed the signed bundles.
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
      - name: Build app
        working-directory: app
        env:
          # macOS signing / notarization (optional; see docs/BUILD_MACOS.md)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the in-app update bundles (.sig files next to them).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          # Unset secrets that are not configured: an empty APPLE_CERTIFICATE would make the
          # bundler try (and fail) to import a signing certificate. Without them the macOS app
          # gets an ad-hoc signature (bundle.macOS.signingIdentity = "-").
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          # Signed in-app update bundles only for official releases (needs the signing key).
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Name the macOS update bundle per architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          M=target/${{ matrix.target }}/release/bundle/macos
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          A=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
          mv "$M/Prism.app.tar.gz" "$M/Prism_${V}_${A}.app.tar.gz"
          mv "$M/Prism.app.tar.gz.sig" "$M/Prism_${V}_${A}.app.tar.gz.sig"
      - name: DMG with the browser extension next to the app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          B=target/${{ matrix.target }}/release/bundle
          DMG=$(ls "$B"/dmg/*.dmg)
          STAGE=$(mktemp -d)/Prism
          mkdir -p "$STAGE/Browser Extension"
          cp -R "$B/macos/Prism.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R extension/build/chromium "$STAGE/Browser Extension/Chrome, Edge, Brave"
          cp -R extension/build/firefox "$STAGE/Browser Extension/Firefox"
          cp packaging/macos/README-extension.txt "$STAGE/Browser Extension/How to install.txt"
          rm -f "$DMG"
          hdiutil create -volname "Prism" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil imageinfo "$DMG" | head -5
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: prism-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.sig
            packaging/out/*.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: runner.os == 'Linux'
        with:
          name: prism-extension
          path: extension/build/*.zip

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect installers and checksums
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.app.tar.gz' \) -exec cp {} out/ \;
          # Manifest for the in-app updater (signatures come from the .sig files).
          python3 scripts/make-latest-json.py artifacts "${GITHUB_REF_NAME}" docs/RELEASE_NOTES.md > latest.json
          cat latest.json
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && mv ../latest.json .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
